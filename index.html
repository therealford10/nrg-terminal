<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenVMS Terminal</title>
  <link rel="stylesheet" href="/terminal.css">
</head>
<body>
  <main id="terminal" aria-label="ARG terminal">
    <div id="screen" class="screen"></div>
    <div id="inputRow" class="input-row hidden">
      <span id="prompt"></span>
      <input id="commandInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
  </main>
  <script src="/terminal.js" defer></script>
</body>
</html>
